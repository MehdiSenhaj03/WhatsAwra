# The release workflow's Flatpak: the binary the Linux job built, packaged
# into the same sandbox as rocks.whatsawra.WhatsAwra.yml describes. The
# job unpacks the release tarball into built/ beside this file first.
id: rocks.whatsawra.WhatsAwra
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: whatsawra
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all
  - --socket=pulseaudio
  - --share=network
  # Archive encryption key.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  # Desktop notifications, which Fastframe sends straight to the server.
  - --talk-name=org.freedesktop.Notifications
  - --persist=.local/state
modules:
  - name: whatsawra
    buildsystem: simple
    build-commands:
      - install -Dm755 whatsawra /app/bin/whatsawra
      - install -Dm644 packaging/applications/*.desktop /app/share/applications/rocks.whatsawra.WhatsAwra.desktop
      - sed -i 's/^Icon=.*$/Icon=rocks.whatsawra.WhatsAwra/;s/^StartupWMClass=whatsawra$/StartupWMClass=rocks.whatsawra.WhatsAwra/' /app/share/applications/rocks.whatsawra.WhatsAwra.desktop
      - install -Dm644 packaging/icons/whatsawra.svg /app/share/icons/hicolor/scalable/apps/rocks.whatsawra.WhatsAwra.svg
      - install -Dm644 packaging/flatpak/rocks.whatsawra.WhatsAwra.metainfo.xml /app/share/metainfo/rocks.whatsawra.WhatsAwra.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/whatsawra/LICENSE
    sources:
      - type: dir
        path: built
      # Metainfo belongs to this packaging checkout, not the portable archive.
      - type: file
        path: rocks.whatsawra.WhatsAwra.metainfo.xml
        dest: packaging/flatpak
