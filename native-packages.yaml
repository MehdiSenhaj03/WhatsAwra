# Shared CLI: gem install native-packages --version 0.11.0
---
schema: 1
tool:
  version: 0.11.0
  nfpm: 2.47.0
# Ubuntu 24.04 and Debian 13 use the t64 package names; older releases the
# plain ones. Sound goes to PipeWire itself, else PulseAudio, else ALSA.
libraries:
  libasound.so.2:
    deb: libasound2t64 | libasound2
    rpm: alsa-lib
  libpipewire-0.3.so.0:
    deb: libpipewire-0.3-0t64 | libpipewire-0.3-0
    rpm: pipewire-libs
nfpm:
  name: whatsawra
  maintainer: Carmine Paolino <carmine@paolino.me>
  homepage: https://whatsawra.rocks
  description: Fast native WhatsApp client
  license: MIT
  contents:
  - src: "@PAYLOAD@/whatsawra-v@VERSION@-@TARGET@/whatsawra"
    dst: "/usr/bin/whatsawra"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/whatsawra-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/whatsawra/LICENSE"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/whatsawra-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/whatsawra/README.md"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/whatsawra-v@VERSION@-@TARGET@/packaging/applications/whatsawra.desktop"
    dst: "/usr/share/applications/whatsawra.desktop"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/whatsawra-v@VERSION@-@TARGET@/packaging/icons/whatsawra.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/whatsawra.svg"
    file_info:
      mode: 420
  - src: contrib/omarchy/whatsawra.json.tpl
    dst: /usr/share/whatsawra/omarchy/whatsawra.json.tpl
    file_info:
      mode: 420
  - src: contrib/omarchy/whatsawra-theme
    dst: /usr/share/whatsawra/omarchy/whatsawra-theme
    file_info:
      mode: 493
  # native-packages adds the C library (libc6, glibc) at the version the
  # binary needs: 2.36, as the release builds run in Debian 12.
  overrides:
    deb:
      depends:
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2t64 | libasound2
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
      - libgcc-s1
      - libstdc++6
    rpm:
      depends:
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - pipewire-libs
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
# Windows code and installers are signed through Azure Artifact Signing as
# PlentyLabs when the windows-signing environment provides the account
# (PACKAGING.md, "Windows signing").
windows:
  signing:
    provider: azure-artifact-signing
    description: WhatsAwra
    publisher: PlentyLabs UG (haftungsbeschränkt) & Co. KG
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'whatsawra-@TAG@-macos-universal.dmg'
  windows-amd64:
    platform: windows
    arch: amd64
    formats: [msi]
    input:
      kind: directory
      local: dist/windows-input-x86_64-pc-windows-msvc
    native:
      command: [ruby, packaging/windows/msi.rb, '@PAYLOAD@', '@PACKAGE@', '@VERSION@']
      output: 'whatsawra-@TAG@-x86_64-pc-windows-msvc.msi'
  windows-arm64:
    platform: windows
    arch: arm64
    formats: [msi]
    input:
      kind: directory
      local: dist/windows-input-aarch64-pc-windows-msvc
    native:
      command: [ruby, packaging/windows/msi.rb, '@PAYLOAD@', '@PACKAGE@', '@VERSION@']
      output: 'whatsawra-@TAG@-aarch64-pc-windows-msvc.msi'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/whatsawra-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: whatsawra-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/whatsawra-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: whatsawra-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
release:
  repository: MehdiSenhaj03/WhatsAwra
  checksums: checksums.txt
  prereleases: true
assets:
  AMD64:
    file: whatsawra-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/whatsawra-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: whatsawra-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/whatsawra-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  MACOS:
    file: whatsawra-v@VERSION@-macos-universal.dmg
    local: dist/whatsawra-v@VERSION@-macos-universal.dmg
  SOURCE:
    file: whatsawra-@VERSION@.tar.gz
    url: https://github.com/MehdiSenhaj03/WhatsAwra/archive/refs/tags/v@VERSION@.tar.gz
    checksummed: false
    local: dist/whatsawra-@VERSION@.tar.gz
templates:
  homebrew/whatsawra.rb: packaging/homebrew/whatsawra.rb.in
  arch/whatsawra/PKGBUILD: packaging/arch/whatsawra/PKGBUILD.in
  arch/whatsawra/whatsawra.install: packaging/arch/whatsawra.install
  arch/whatsawra-bin/PKGBUILD: packaging/arch/whatsawra-bin/PKGBUILD.in
  arch/whatsawra-bin/whatsawra-bin.install: packaging/arch/whatsawra.install
  arch/whatsawra-git/PKGBUILD: packaging/arch/whatsawra-git/PKGBUILD.in
  arch/whatsawra-git/whatsawra-git.install: packaging/arch/whatsawra.install
repositories:
  homebrew:
    url: https://github.com/crmne/homebrew-tap.git
    push_url: https://github.com/crmne/homebrew-tap.git
    branch: main
    package_path: Casks
    files:
      homebrew/whatsawra.rb: Casks/whatsawra.rb
    version_file: Casks/whatsawra.rb
    version_pattern: 'version "([^"]+)"'
    publish: push
  aur-source:
    group: aur
    url: https://aur.archlinux.org/whatsawra.git
    push_url: ssh://aur@aur.archlinux.org/whatsawra.git
    branch: master
    package_path: "."
    files:
      arch/whatsawra: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-bin:
    group: aur
    url: https://aur.archlinux.org/whatsawra-bin.git
    push_url: ssh://aur@aur.archlinux.org/whatsawra-bin.git
    branch: master
    package_path: "."
    files:
      arch/whatsawra-bin: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-git:
    group: aur
    url: https://aur.archlinux.org/whatsawra-git.git
    push_url: ssh://aur@aur.archlinux.org/whatsawra-git.git
    branch: master
    package_path: "."
    files:
      arch/whatsawra-git: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
version_file: Cargo.toml
